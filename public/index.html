<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Assistant — Digital Studio By Naeema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============ Design tokens ============ */
  :root {
    --ground: #F1F4F0;
    --surface: #FBFAF7;
    --surface-raised: #FFFFFF;
    --ink: #1B211E;
    --ink-soft: #52605A;
    --ink-faint: #8B9993;
    --border: #DCE3DA;
    --accent: #B5692A;
    --accent-ink: #FFFFFF;
    --accent-soft: #E8D9C8;
    --growth: #4F7A5E;
    --growth-soft: #DCEADF;
    --shadow: rgba(27, 33, 30, 0.08);
    --focus-ring: rgba(181, 105, 42, 0.35);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #14181A;
      --surface: #1B2022;
      --surface-raised: #20262A;
      --ink: #E9EDE9;
      --ink-soft: #A9B4AE;
      --ink-faint: #6E7A75;
      --border: #2C3336;
      --accent: #E08A45;
      --accent-ink: #1B211E;
      --accent-soft: #3A2E22;
      --growth: #7FAE8E;
      --growth-soft: #223026;
      --shadow: rgba(0, 0, 0, 0.35);
      --focus-ring: rgba(224, 138, 69, 0.4);
    }
  }

  :root[data-theme="dark"] {
    --ground: #14181A;
    --surface: #1B2022;
    --surface-raised: #20262A;
    --ink: #E9EDE9;
    --ink-soft: #A9B4AE;
    --ink-faint: #6E7A75;
    --border: #2C3336;
    --accent: #E08A45;
    --accent-ink: #1B211E;
    --accent-soft: #3A2E22;
    --growth: #7FAE8E;
    --growth-soft: #223026;
    --shadow: rgba(0, 0, 0, 0.35);
    --focus-ring: rgba(224, 138, 69, 0.4);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  ::selection { background: var(--accent-soft); }

  /* ============ Layout shell ============ */
  .shell {
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 100vh;
    padding: 0 20px;
  }

  /* ============ Header ============ */
  .studio-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 28px 4px 20px;
    border-bottom: 1px solid var(--border);
    opacity: 0;
    animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .studio-id {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }

  .studio-mark {
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: -0.01em;
    color: var(--ink);
    text-wrap: balance;
  }

  .studio-sub {
    font-size: 13px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 12px;
    border-radius: 100px;
    background: var(--growth-soft);
    color: var(--growth);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--growth);
    box-shadow: 0 0 0 3px var(--growth-soft);
  }

  .status-pill[data-state="thinking"] {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .status-pill[data-state="thinking"] .status-dot {
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
    animation: pulse 1.1s ease-in-out infinite;
  }
  .status-pill[data-state="error"] {
    background: #F4DADA;
    color: #A23B3B;
  }
  .status-pill[data-state="error"] .status-dot {
    background: #A23B3B;
    box-shadow: 0 0 0 3px #F4DADA;
  }

  /* ============ Conversation ============ */
  .conversation {
    flex: 1;
    padding: 28px 4px 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    overflow-y: auto;
  }

  .intro {
    opacity: 0;
    animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
  }

  .intro h1 {
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: clamp(24px, 4vw, 32px);
    line-height: 1.25;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
    text-wrap: balance;
    max-width: 30ch;
  }

  .intro p {
    color: var(--ink-soft);
    font-size: 15px;
    line-height: 1.6;
    max-width: 52ch;
    margin: 0 0 20px;
  }

  .suggestion-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .suggestion {
    font-family: inherit;
    font-size: 13px;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 13px;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }

  .suggestion:hover {
    border-color: var(--accent);
    color: var(--ink);
    transform: translateY(-1px);
  }

  .suggestion:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ============ Messages ============ */
  .msg {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 88%;
    animation: rise 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .msg.user {
    align-self: flex-end;
    align-items: flex-end;
  }

  .msg.assistant {
    align-self: flex-start;
    align-items: flex-start;
  }

  .msg-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    padding: 0 2px;
  }

  .msg-bubble {
    padding: 13px 16px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
  }

  .msg.user .msg-bubble {
    background: var(--ink);
    color: var(--ground);
    border-bottom-right-radius: 4px;
  }

  .msg.assistant .msg-bubble {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px var(--shadow);
    border-bottom-left-radius: 4px;
  }

  .msg.assistant .msg-bubble.error {
    border-color: #C97C7C;
    color: #A23B3B;
  }

  .thinking-dots {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    padding: 4px 2px;
  }

  .thinking-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ink-faint);
    animation: bounce 1.2s ease-in-out infinite;
  }
  .thinking-dots span:nth-child(2) { animation-delay: 0.15s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.3s; }

  /* ============ Composer ============ */
  .composer {
    padding: 16px 4px 24px;
    opacity: 0;
    animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
  }

  .composer-field {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 8px 8px 8px 16px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .composer-field:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--focus-ring);
  }

  #question {
    flex: 1;
    border: none;
    background: transparent;
    resize: none;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;
    color: var(--ink);
    padding: 8px 0;
    max-height: 140px;
  }

  #question:focus { outline: none; }
  #question::placeholder { color: var(--ink-faint); }

  .send-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border: none;
    border-radius: 11px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }

  .send-btn:hover:not(:disabled) { transform: translateY(-1px); }
  .send-btn:active:not(:disabled) { transform: translateY(0); }
  .send-btn:disabled { opacity: 0.4; cursor: default; }

  .send-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .composer-footnote {
    margin: 10px 4px 0;
    font-size: 12px;
    color: var(--ink-faint);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-family: "IBM Plex Mono", monospace;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.6); opacity: 0.5; }
  }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }

  @media (max-width: 520px) {
    .shell { padding: 0 14px; }
    .studio-header { padding-top: 20px; }
  }
</style>
</head>
<body>

<div class="shell">

  <header class="studio-header">
    <div class="studio-id">
      <span class="studio-mark">Digital Studio</span>
      <span class="studio-sub">Growth Assistant</span>
    </div>
    <div class="status-pill" id="statusPill" data-state="idle">
      <span class="status-dot"></span>
      <span id="statusText">Connected · Gemini</span>
    </div>
  </header>

  <main class="conversation" id="conversation">
    <div class="intro" id="intro">
      <h1>Ask your store anything.</h1>
      <p>This assistant knows Digital Studio By Naeema's catalog, markets, and customers — ask it for SEO keywords, listing ideas, seasonal angles, or a quick strategy check.</p>
      <div class="suggestion-row">
        <button class="suggestion" type="button">Suggest 5 SEO keywords for our Halloween SVG bundles</button>
        <button class="suggestion" type="button">Write 3 short listing titles for a new baby shower bundle</button>
        <button class="suggestion" type="button">What seasonal collection should we plan next for the UK market?</button>
      </div>
    </div>
  </main>

  <form class="composer" id="composer">
    <div class="composer-field">
      <textarea id="question" rows="1" placeholder="Ask about SEO, listings, marketing, or your customers…" required></textarea>
      <button class="send-btn" id="sendBtn" type="submit" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="composer-footnote">
      <span>digitalstudiobynaeema.com</span>
      <span id="providerTag">provider: gemini</span>
    </div>
  </form>

</div>

<script>
  const form = document.getElementById('composer');
  const input = document.getElementById('question');
  const sendBtn = document.getElementById('sendBtn');
  const conversation = document.getElementById('conversation');
  const intro = document.getElementById('intro');
  const statusPill = document.getElementById('statusPill');
  const statusText = document.getElementById('statusText');

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  document.querySelectorAll('.suggestion').forEach(btn => {
    btn.addEventListener('click', () => {
      input.value = btn.textContent;
      input.dispatchEvent(new Event('input'));
      input.focus();
    });
  });

  function setStatus(state, text) {
    statusPill.dataset.state = state;
    statusText.textContent = text;
  }

  function addMessage(role, text) {
    if (intro.parentNode) intro.remove();
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = role === 'user' ? 'You' : 'Assistant';
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;
    wrap.appendChild(label);
    wrap.appendChild(bubble);
    conversation.appendChild(wrap);
    conversation.scrollTop = conversation.scrollHeight;
    return bubble;
  }

  function addThinking() {
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant';
    wrap.id = 'thinkingMsg';
    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = 'Assistant';
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = '<span class="thinking-dots"><span></span><span></span><span></span></span>';
    wrap.appendChild(label);
    wrap.appendChild(bubble);
    conversation.appendChild(wrap);
    conversation.scrollTop = conversation.scrollHeight;
  }

  function removeThinking() {
    const el = document.getElementById('thinkingMsg');
    if (el) el.remove();
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addMessage('user', question);
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    setStatus('thinking', 'Thinking…');
    addThinking();

    try {
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: question })
      });

      const data = await res.json().catch(() => ({}));
      removeThinking();

      if (!res.ok) {
        addMessage('assistant', data.error || 'Something went wrong reaching the assistant.').classList.add('error');
        setStatus('error', 'Connection issue');
        return;
      }

      addMessage('assistant', data.reply || 'No reply received.');
      setStatus('idle', 'Connected · Gemini');
    } catch (err) {
      removeThinking();
      addMessage('assistant', 'Could not reach the server. Check that it is running.').classList.add('error');
      setStatus('error', 'Offline');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>

</body>
</html>
